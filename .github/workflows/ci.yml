name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Better Auth schema drift
        run: |
          npm run auth:schema
          git diff --exit-code -- server/db/auth-schema.js

      - name: Run tests
        run: npm test

      - name: Build Nuxt server
        run: npm run build
